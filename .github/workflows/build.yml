name: Build Windows Executable

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pygame pyinstaller
    
    - name: Create assets
      run: |
        mkdir assets\fonts
        mkdir assets\images
        curl -o assets\fonts\OpenSans-Regular.ttf https://github.com/google/fonts/raw/main/apache/opensans/OpenSans-Regular.ttf
    
    - name: Create placeholder images
      run: |
        python -c "import pygame; pygame.init(); s=pygame.Surface((32,32)); s.fill((255,0,0)); pygame.image.save(s,'assets/images/flag.png'); s.fill((0,0,0)); pygame.image.save(s,'assets/images/mine.png')"
    
    - name: Build exe
      run: |
        pyinstaller --onefile --windowed --add-data "assets;assets" runner.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minesweeper-exe
        path: dist/*.exe