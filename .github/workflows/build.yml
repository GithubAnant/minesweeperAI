name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole runner.py --name minesweeper-windows
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: windows-exe
        path: dist/minesweeper-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole runner.py --name minesweeper-mac
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: mac-exe
        path: dist/minesweeper-mac

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v3
      with:
        name: windows-exe
        
    - name: Download Mac artifact
      uses: actions/download-artifact@v3
      with:
        name: mac-exe
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          minesweeper-windows.exe
          minesweeper-mac
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}