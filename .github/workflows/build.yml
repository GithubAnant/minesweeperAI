name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: minesweeper-windows.exe
          - os: macos-13  # Intel Mac
            name: minesweeper-mac-intel
            arch: x86_64
          - os: macos-latest  # Silicon Mac
            name: minesweeper-mac-silicon
            arch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build executable
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          pyinstaller --onefile --windowed --name "${{ matrix.name }}" runner.py
        else
          pyinstaller --onefile --windowed --target-arch ${{ matrix.arch }} --name "${{ matrix.name }}" runner.py
        fi
      shell: bash
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.name }}*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}