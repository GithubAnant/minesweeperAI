name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: windows

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --add-data "assets${SEPARATOR}assets" --name "Minesweeper-${{ matrix.name }}" runner.py
      env:
        SEPARATOR: ${{ runner.os == 'Windows' && ';' || ':' }}

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          dist/Minesweeper-${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          mac/Minesweeper-mac
          windows/Minesweeper-windows.exe
        body: |
          ## Simple Minesweeper Executables
          
          Just download and run:
          - **Mac (Apple Silicon)**: `Minesweeper-mac`
          - **Windows**: `Minesweeper-windows.exe`
          
          No installation needed!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}