name: Build Windows and macOS Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Create assets directory structure
      run: |
        mkdir -p assets/fonts
        mkdir -p assets/images
        
    - name: Download font asset
      run: |
        curl -L -o "assets/fonts/OpenSans-Regular.ttf" "https://github.com/google/fonts/raw/main/apache/opensans/OpenSans-Regular.ttf"

    - name: Create placeholder images
      run: |
        python -c "
import pygame
pygame.init()
flag_surf = pygame.Surface((32, 32))
flag_surf.fill((255, 0, 0))
pygame.image.save(flag_surf, 'assets/images/flag.png')
mine_surf = pygame.Surface((32, 32))
mine_surf.fill((0, 0, 0))
pygame.draw.circle(mine_surf, (64, 64, 64), (16, 16), 12)
pygame.image.save(mine_surf, 'assets/images/mine.png')
"
        
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --name=Minesweeper --onefile --windowed --add-data="assets;assets" --distpath=dist --workpath=build --specpath=build --clean --noconfirm --optimize=2 runner.py
                    
    - name: Test executable
      run: |
        if (Test-Path "dist/Minesweeper.exe") {
          Write-Output "✓ Executable created successfully"
        } else {
          Write-Error "✗ Executable not found"
          exit 1
        }
        
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minesweeper-Windows-Executable
        path: dist/Minesweeper.exe
        retention-days: 30
        
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install pygame pyinstaller
        
    - name: Create assets directory structure
      run: |
        mkdir -p assets/fonts
        mkdir -p assets/images
        
    - name: Download font asset
      run: |
        curl -L -o "assets/fonts/OpenSans-Regular.ttf" "https://github.com/google/fonts/raw/main/apache/opensans/OpenSans-Regular.ttf"

    - name: Create placeholder images
      run: |
        python3 -c "

import pygame 
pygame.init()
flag_surf = pygame.Surface((32, 32))
flag_surf.fill((255, 0, 0))
pygame.image.save(flag_surf, 'assets/images/flag.png')
mine_surf = pygame.Surface((32, 32))
mine_surf.fill((0, 0, 0))
pygame.draw.circle(mine_surf, (64, 64, 64), (16, 16), 12)
pygame.image.save(mine_surf, 'assets/images/mine.png')
"
        
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --name=Minesweeper --onefile --add-data "assets:assets" --distpath=dist --workpath=build --specpath=build --clean --noconfirm --optimize=2 runner.py
                    
    - name: Test executable
      run: |
        if [ -d "dist/Minesweeper.app" ]; then
          echo "✓ Executable created successfully"
        else
          echo "✗ Executable not found"
          exit 1
        fi
        
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minesweeper-macOS-Executable
        path: dist/Minesweeper.app
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: ls -R artifacts
      
      - name: Create release on tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Minesweeper-Windows-Executable/Minesweeper.exe
            artifacts/Minesweeper-macOS-Executable/Minesweeper.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}