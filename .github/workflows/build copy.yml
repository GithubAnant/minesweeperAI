name: Build macOS Executable Updated

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller requests

      - name: Verify assets exist
        run: |
          ls -la assets/
          ls -la assets/images/

      - name: Build app
        run: |
          pyinstaller --onefile --windowed --add-data "assets:assets" runner.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-macos
          path: dist/*